[package]
name = "codewhale-codegraph"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "CodeGraph Rust core: wire/contract, schema, store, resolver ctx/resolver, and the tree-sitter extraction kernel"

[lints]
workspace = true

[dependencies]
regex = "1.11"
rusqlite.workspace = true
serde_json.workspace = true
sha2.workspace = true
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-rust = "=0.24.2"
tree-sitter-c = "=0.24.2"
tree-sitter-cpp = "=0.23.4"
tree-sitter-c-sharp = "=0.23.5"
tree-sitter-ruby = "=0.23.1"
tree-sitter-php = "=0.24.2"
tree-sitter-swift = "=0.7.3"
tree-sitter-r = "=1.2.0"
tree-sitter-luau = "=1.2.0"
tree-sitter-pascal = "=0.10.2"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
cc = "1.1"

[dev-dependencies]
serde_json.workspace = true

[[test]]
name = "wire"
path = "tests/wire/main.rs"

[[test]]
name = "contract"
path = "tests/contract/main.rs"

[[test]]
name = "e2e"
path = "tests/e2e.rs"
