[package]
name = "chimera-session-data"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "ABI-stable Session Data Plane for Chimera: bounded tool-output spooling, canonical writes, and rebuildable context projections"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "async"] }
napi-derive = "3"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
serde_json = "1"
sha2 = "0.11"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"

[build-dependencies]
napi-build = "2"

[dev-dependencies]
napi = { version = "3", default-features = false, features = ["napi8", "noop"] }

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
